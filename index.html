const SUPABASE_URL =
"https://nmxdvvagdanajplzgyju.supabase.co";

function money(n){
return Number(n||0).toLocaleString("lv-LV",{
minimumFractionDigits:2,
maximumFractionDigits:2
})+" €";
}

function esc(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function showNotice(id,text,type=""){
const el=$(id);
if(!el)return;
el.className="notice "+type;
el.textContent=text;
}

function initSupabase(){

const key=
localStorage.getItem("terra_supabase_key");

if(
key &&
window.supabase &&
typeof window.supabase.createClient==="function"
){

sb=window.supabase.createClient(
SUPABASE_URL,
key
);

}

return !!sb;
}

function saveSupabaseKey(){

const key=
$("supabaseKey").value.trim();

if(!key){

showNotice(
"supabaseStatus",
"Ievadi Supabase Publishable Key.",
"error"
);

return;
}

localStorage.setItem(
"terra_supabase_key",
key
);

if(initSupabase()){

showNotice(
"supabaseStatus",
"Supabase savienojums izveidots.",
"success"
);

loadObjects();
loadDashboard();
}

}

async function testSupabase(){

if(!sb){
initSupabase();
}

if(!sb){

showNotice(
"supabaseStatus",
"Vispirms ievadi Supabase Publishable Key.",
"error"
);

return;
}

const {error}=await sb
.from("objekti")
.select("id")
.limit(1);

if(error){

showNotice(
"supabaseStatus",
"Supabase kļūda: "+
error.message,
"error"
);

return;
}

showNotice(
"supabaseStatus",
"Supabase savienojums darbojas.",
"success"
);

loadDashboard();

}

async function loadDashboard(){

const box=$("dashboardContent");

if(!box||!sb)return;

box.innerHTML=
'<p class="small">Ielādē vadības paneli...</p>';

try{

const [
objR,
workR,
approvalR
]=await Promise.all([

sb
.from("objekti")
.select("id,nosaukums,statuss,created_at")
.order("created_at",{ascending:false}),

sb
.from("papilddarbi")
.select("id,objekts_id,nosaukums,daudzums,cena,materials,darbs,statuss,created_at")
.order("created_at",{ascending:false}),

sb
.from("saskanojumi")
.select("id,papilddarbs_id,statuss,klienta_vards,created_at,apstiprinats_at")
.order("created_at",{ascending:false})

]);

if(objR.error)throw objR.error;
if(workR.error)throw workR.error;
if(approvalR.error)throw approvalR.error;

const objs=objR.data||[];
const works=workR.data||[];
const approvals=approvalR.data||[];

const active=
objs.filter(
o=>(o.statuss||"Aktīvs")==="Aktīvs"
).length;

const waiting=
works.filter(
w=>(w.statuss||"")==="Gaida saskaņošanu"
).length;

const approved=
works.filter(
w=>(w.statuss||"")==="Apstiprināts"
).length;

const rejected=
works.filter(
w=>(w.statuss||"")==="Noraidīts"
).length;

const revenue=
works
.filter(w=>
(w.statuss||"")==="Apstiprināts"
)
.reduce(
(sum,w)=>
sum+
Number(w.daudzums||0)*
Number(w.cena||0),
0
);

const costs=
works
.filter(w=>
(w.statuss||"")==="Apstiprināts"
)
.reduce(
(sum,w)=>
sum+
Number(w.daudzums||0)*
(
Number(w.materials||0)+
Number(w.darbs||0)
),
0
);

const profit=
revenue-costs;

const money2=n=>
Number(n||0).toLocaleString(
"lv-LV",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
)+" €";

const workMap=
new Map(
works.map(w=>[w.id,w])
);

const objMap=
new Map(
objs.map(o=>[o.id,o])
);

const activities=
approvals
.slice(0,8)
.map(a=>{

const w=
workMap.get(
a.papilddarbs_id
);

const o=
w?
objMap.get(
w.objekts_id
):
null;

return{
title:
w?.nosaukums||
"Papilddarbs",

meta:
(o?.nosaukums||
"Objekts")+
(
a.klienta_vards?
" · "+a.klienta_vards:
""
),

status:
a.statuss||
"Gaida",

date:
a.created_at
};

});

const workActivities=
works
.filter(
w=>
!approvals.some(
a=>
a.papilddarbs_id===
w.id
)
)
.slice(0,8)
.map(w=>({

title:w.nosaukums,

meta:
objMap.get(
w.objekts_id
)?.nosaukums||
"Objekts",

status:
w.statuss||
"Gaida saskaņošanu",

date:w.created_at

}));

const allActivities=
[
...activities,
...workActivities
]
.sort(
(a,b)=>
new Date(b.date||0)-
new Date(a.date||0)
)
.slice(0,8);

box.innerHTML=`

<div class="dashboard">

<div class="dash-card">
<div class="dash-label">
🏗️ Aktīvie objekti
</div>

<div class="dash-number">

async function uploadPhoto(

objectId,
workId=null
){

if(!sb)return;

const safeName=
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const path=
objectId+
"/"+
Date.now()+
"_"+
safeName;

const {
error:uploadError
}=await sb.storage
.from("objekta-foto")
.upload(
path,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);

if(uploadError){

console.error(
"Foto augšupielādes kļūda:",
uploadError
);

return;
}

await sb
.from("foto")
.insert([{

objekts_id:
objectId,

papilddarbs_id:
workId,

faila_url:
path,

apraksts:
file.name

}]);

}

const address=

const unit=

);

const labor=

);

const discount=

);

const gross=
