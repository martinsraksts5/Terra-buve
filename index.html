   TERRA BŪVE
   PILNA OBJEKTU SISTĒMA
   ========================================================= */

const SUPABASE_URL =
  "https://nmxdvvagdanajplzgyju.supabase.co";

let sb = null;
let currentObject = null;
let currentWork = null;

const $ = id => document.getElementById(id);

function money(n){
  return Number(n || 0).toLocaleString("lv-LV",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }) + " €";
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showNotice(id,text,type=""){
  const el=$(id);
  if(!el)return;
  el.className="notice "+type;
  el.textContent=text;
}

function initSupabase(){
  const key=localStorage.getItem("terra_supabase_key");

  if(
    key &&
    window.supabase &&
    typeof window.supabase.createClient==="function"
  ){
    sb=window.supabase.createClient(
      SUPABASE_URL,
      key
    );
  }

  return !!sb;
}

function saveSupabaseKey(){
  const key=$("supabaseKey").value.trim();

  if(!key){
    showNotice(
      "supabaseStatus",
      "Ievadi Supabase Publishable Key.",
      "error"
    );
    return;
  }

  localStorage.setItem(
    "terra_supabase_key",
    key
  );

  if(initSupabase()){
    showNotice(
      "supabaseStatus",
      "Supabase savienojums izveidots.",
      "success"
    );

    loadObjects();
  }
}

/* =========================================================
   SUPABASE TEST
   ========================================================= */

async function testSupabase(){

if(!sb){
  initSupabase();
}

if(!sb){
  showNotice(
    "supabaseStatus",
    "Vispirms ievadi Supabase Publishable Key.",
    "error"
  );
  return;
}

const {error}=await sb
  .from("objekti")
  .select("id")
  .limit(1);

if(error){
  showNotice(
    "supabaseStatus",
    "Supabase kļūda: "+error.message,
    "error"
  );
  return;
}

showNotice(
  "supabaseStatus",
  "Supabase savienojums darbojas.",
  "success"
);

}

/* =========================================================
   CREATE OBJECT
   ========================================================= */

async function createObject(){

if(!sb){
  initSupabase();
}

if(!sb){
  showNotice(
    "objectCreateStatus",
    "Vispirms pieslēdz Supabase.",
    "error"
  );
  return;
}

const n=$("objName").value.trim();

if(!n){
  showNotice(
    "objectCreateStatus",
    "Ievadi objekta nosaukumu.",
    "error"
  );
  return;
}

const payload={
  nosaukums:n,
  klients:$("clientName").value.trim(),
  telefons:$("clientPhone").value.trim(),
  adrese:$("objAddress").value.trim(),
  piezimes:$("objNotes").value.trim(),
  statuss:"Aktīvs"
};

const {data,error}=await sb
  .from("objekti")
  .insert([payload])
  .select("*")
  .single();

if(error){

  alert(
    "SUPABASE KĻŪDA\n\n"+
    "Code: "+(error.code||"")+"\n\n"+
    "Message: "+(error.message||"")+"\n\n"+
    "Details: "+(error.details||"")+"\n\n"+
    "Hint: "+(error.hint||"")
  );

  return;
}

await loadObjects();

$("objectSelect").value=data.id;

await loadObject();

showNotice(
  "objectCreateStatus",
  "✓ Objekts izveidots!",
  "success"
);

}

/* =========================================================
   LOAD OBJECTS
   ========================================================= */

async function loadObjects(){

if(!sb)return;

const {data,error}=await sb
  .from("objekti")
  .select("*")
  .order("created_at",{ascending:false});

if(error){
  showNotice(
    "supabaseStatus",
    "Neizdevās ielādēt objektus: "+error.message,
    "error"
  );
  return;
}

const select=$("objectSelect");

if(select){
  select.innerHTML=
    '<option value="">-- izvēlies objektu --</option>';

  (data||[]).forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o.id;
    opt.textContent=
      (o.nosaukums||"Bez nosaukuma")+
      (o.klients?" — "+o.klients:"");
    select.appendChild(opt);
  });
}

const list=$("objectsList");

if(!list)return;

if(!data||!data.length){
  list.innerHTML=
    '<div class="notice">Objektu vēl nav.</div>';
  return;
}

list.innerHTML=data.map(o=>`

<div class="object-card">

<h3>${esc(o.nosaukums)}</h3>

<div>
<strong>Klients:</strong>
${esc(o.klients||"—")}
</div>

<div>
<strong>Telefons:</strong>
${esc(o.telefons||"—")}
</div>

<div>
<strong>Adrese:</strong>
${esc(o.adrese||"—")}
</div>

<span class="badge">
${esc(o.statuss||"Aktīvs")}
</span>

</div>

`).join("");

}

/* =========================================================
   LOAD ONE OBJECT
   ========================================================= */

async function loadObject(){

if(!sb)return;

const id=$("objectSelect")?.value;

if(!id){
  $("objectDetails").innerHTML="";
  return;
}

const {data,error}=await sb
  .from("objekti")
  .select("*")
  .eq("id",id)
  .single();

if(error){
  $("objectDetails").innerHTML=
    '<div class="notice error">'+
    esc(error.message)+
    '</div>';
  return;
}

currentObject=data;

await renderObjectDetails();

}

function workCard(w){

  Number(w.daudzums||0)*
  Number(w.cena||0);

/* =========================================================
   ADD WORK
   ========================================================= */

async function addWork(){

if(!currentObject){
  showNotice(
    "workStatus",
    "Vispirms izvēlies objektu.",
    "error"
  );
  return;
}

const name=$("workName").value.trim();

if(!name){
  showNotice(
    "workStatus",
    "Ievadi papilddarba nosaukumu.",
    "error"
  );
  return;
}

const qty=Number($("workQty").value||0);
const unit=$("workUnit").value;
const price=Number($("workPrice").value||0);
const materials=Number($("workMaterials").value||0);
const labor=Number($("workLabor").value||0);
const description=$("workDescription").value.trim();

const payload={
  objekts_id:currentObject.id,
  nosaukums:name,
  apraksts:description,
  daudzums:qty,
  vienibas:unit,
  cena:price,
  materials:materials,
  darbs:labor,
  statuss:"Gaida saskaņošanu"
};

const {data,error}=await sb
  .from("papilddarbi")
  .insert([payload])
  .select("*")
  .single();

if(error){
  showNotice(
    "workStatus",
    "Neizdevās saglabāt papilddarbu: "+
    error.message,
    "error"
  );
  return;
}

const file=$("workPhoto")?.files?.[0];

if(file){
  await uploadPhoto(
    file,
    currentObject.id,
    data.id
  );
}

$("workName").value="";
$("workQty").value="1";
$("workPrice").value="0";
$("workMaterials").value="0";
$("workLabor").value="0";
$("workDescription").value="";
$("workPhoto").value="";

showNotice(
  "workStatus",
  "✓ Papilddarbs saglabāts.",
  "success"
);

await renderObjectDetails();

}

/* =========================================================
   UPLOAD PHOTO
   ========================================================= */

async function uploadPhoto(
  file,
  objectId,
  workId=null
){

if(!sb)return;

const safeName=
  file.name
  .replace(/[^a-zA-Z0-9._-]/g,"_");

const path=
  objectId+
  "/"+
  Date.now()+
  "_"+
  safeName;

const {error:uploadError}=
  await sb.storage
    .from("objekta-foto")
    .upload(
      path,
      file,
      {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      }
    );

if(uploadError){
  console.error(
    "Foto augšupielādes kļūda:",
    uploadError
  );
  return;
}

const {data:signed,error:signedError}=
  await sb.storage
    .from("objekta-foto")
    .createSignedUrl(
      path,
      60*60*24*7
    );

if(signedError){
  console.error(signedError);
  return;
}

await sb
  .from("foto")
  .insert([{
    objekts_id:objectId,
    papilddarbs_id:workId,
    faila_url:path,
    apraksts:file.name
  }]);

return signed?.signedUrl||"";

}

/* =========================================================
   SHOW PHOTOS
   ========================================================= */

async function showWorkPhotos(workId){

const box=
  document.getElementById(
    "photos-"+workId
  );

if(box){
  box.remove();
  return;
}

const {data,error}=await sb
  .from("foto")
  .select("*")
  .eq("papilddarbs_id",workId)
  .order("created_at",{ascending:false});

if(error){
  alert(
    "Foto kļūda: "+
    error.message
  );
  return;
}

const parent=
  [...document.querySelectorAll(".work-card")]
  .find(card =>
    card.innerHTML.includes(workId)
  );

if(!parent)return;

const div=document.createElement("div");

div.id="photos-"+workId;
div.className="photo-grid";

if(!data?.length){
  div.innerHTML=
    '<div class="small-text">Foto vēl nav.</div>';
  parent.appendChild(div);
  return;
}

for(const photo of data){

  const result=
    await sb.storage
      .from("objekta-foto")
      .createSignedUrl(
        photo.faila_url,
        60*60
      );

  if(result.data?.signedUrl){

    const img=
      document.createElement("img");

    img.src=result.data.signedUrl;

    div.appendChild(img);
  }
}

parent.appendChild(div);

}

/* =========================================================

   ========================================================= */

async function createApproval(workId){

if(!sb)return;

const {data:work,error:workError}=
  await sb
    .from("papilddarbi")
    .select("*")
    .eq("id",workId)
    .single();

if(workError){
  alert(
    "Neizdevās atrast papilddarbu: "+
    workError.message
  );
  return;
}

const {data:existing,error:existingError}=
  await sb
    .from("saskanojumi")
    .select("*")
    .eq("papilddarbs_id",workId)
    .order("created_at",{ascending:false})
    .limit(1);

if(existingError){
  alert(
    "Saskaņošanas kļūda: "+
    existingError.message
  );
  return;
}

let approval=existing?.[0];

if(!approval){

  const {data:newApproval,error}=
    await sb
      .from("saskanojumi")
      .insert([{
        papilddarbs_id:workId,
        statuss:"Gaida"
      }])
      .select("*")
      .single();

  if(error){
    alert(
      "Neizdevās izveidot saskaņošanu: "+
      error.message
    );
    return;
  }

  approval=newApproval;
}

const link=
  window.location.origin+
  window.location.pathname+
  "?saskano="+
  encodeURIComponent(
    approval.id
  );

const box=
  $("approval-"+workId);

if(box){

box.innerHTML=`

<strong>🔗 Klienta saskaņošanas saite</strong>

readonly
value="${esc(link)}"
onclick="this.select()">

class="btn small"
onclick="copyText('${esc(link)}')">
📋 Nokopēt saiti
</button>

<button
class="btn secondary small"
onclick="window.open('${esc(link)}','_blank')">
👁 Atvērt klienta režīmā
</button>

</div>

`;

}

/* =========================================================
   COPY
   ========================================================= */

async function copyText(text){

try{
  await navigator.clipboard.writeText(text);
  alert("Saite nokopēta!");
}catch(e){

  const temp=
    document.createElement("textarea");

  temp.value=text;

  document.body.appendChild(temp);

  temp.select();

  document.execCommand("copy");

  temp.remove();

  alert("Saite nokopēta!");

}

}

/* =========================================================
   CLIENT DECISION
   ========================================================= */

async function clientDecision(
  approvalId,
  decision
){

if(!sb){
  initSupabase();
}

if(!sb){
  alert(
    "Nav Supabase savienojuma."
  );
  return;
}

const name=
  $("clientNameApproval")?.value.trim()||"";

const comment=
  $("clientComment")?.value.trim()||"";

if(!name){
  alert(
    "Lūdzu, ievadiet savu vārdu."
  );
  return;
}

const {error}=await sb
  .from("saskanojumi")
  .update({
    statuss:decision,
    klienta_vards:name,
    klienta_komentars:comment,
    apstiprinats_at:new Date().toISOString()
  })
  .eq("id",approvalId);

if(error){

  showNotice(
    "clientDecisionStatus",
    "Neizdevās saglabāt lēmumu: "+
    error.message,
    "error"
  );

  return;
}

const {data:approval}=await sb
  .from("saskanojumi")
  .select("papilddarbs_id")
  .eq("id",approvalId)
  .single();

if(approval?.papilddarbs_id){

  await sb
    .from("papilddarbi")
    .update({
      statuss:
        decision==="Apstiprināts"
        ?
        "Apstiprināts"
        :
        "Noraidīts",
      klienta_lemums:decision,
      saskanosanas_laiks:
        new Date().toISOString()
    })
    .eq(
      "id",
      approval.papilddarbs_id
    );
}

document.getElementById("app").innerHTML=`

<div class="client-page">

<div class="container">

<div class="client-box">

<div class="client-logo">
TERRA BŪVE
</div>

<div class="notice success">

${
  decision==="Apstiprināts"
  ?
  "✓ Papilddarbs ir apstiprināts."
  :

}

<p style="text-align:center">

</p>

`;

}

/* =========================================================

   ========================================================= */

function calculateQuote(){

const client=
  $("calcClient").value.trim();

const address=
  $("calcAddress").value.trim();

const work=
  $("calcWork").value.trim();

const unit=
  $("calcUnit").value;

const qty=
  Number($("calcQty").value||0);

const price=
  Number($("calcPrice").value||0);

const material=
  Number($("calcMaterial").value||0);

const labor=
  Number($("calcLabor").value||0);

const discount=
  Number($("calcDiscount").value||0);

const gross=
  qty*price;

const discountAmount=
  gross*(discount/100);

const total=
  gross-discountAmount;

const costs=
  qty*(material+labor);

const profit=
  total-costs;

const margin=
  total>0
  ?
  (profit/total)*100
  :
  0;

$("calcResult").innerHTML=`

<div class="total-box">

<div class="total-row">
<span>Klients</span>
<strong>${esc(client||"—")}</strong>
</div>

<div class="total-row">

</div>

<div class="total-row">
<span>Darbs</span>
<strong>${esc(work||"—")}</strong>
</div>

<div class="total-row">
<span>Daudzums</span>
<strong>
${qty} ${esc(unit)}
</strong>
</div>

<div class="total-row">
<span>Bruto summa</span>
<strong>${money(gross)}</strong>
</div>

<div class="total-row">
<span>Atlaide</span>
<strong>${money(discountAmount)}</strong>
</div>

<div class="total-row big">
<span>Klienta cena</span>
<strong>${money(total)}</strong>
</div>

<hr style="border-color:#333">

<div class="total-row">
<span>Iekšējās izmaksas</span>
<strong>${money(costs)}</strong>
</div>

<div class="total-row">
<span>Peļņa</span>
<strong>${money(profit)}</strong>
</div>

<div class="total-row">
<span>Peļņas marža</span>
<strong>${margin.toFixed(1)}%</strong>
</div>

</div>

`;

window.lastQuote={
  client,
  address,
  work,
  unit,
  qty,
  price,
  material,
  labor,
  discount,
  gross,
  discountAmount,
  total,
  costs,
  profit,
  margin
};

}
