<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terra Būve – Objektu sistēma</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090a0c;
  color:#fff;
}

header{
  background:#111317;
  border-bottom:1px solid #2b2d31;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  max-width:1100px;
  margin:auto;
  font-size:26px;
  font-weight:900;
  color:#f0c75e;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111317;
  border:1px solid #30343b;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}

h1,h2,h3{
  margin-top:0;
}

h1{
  color:#f0c75e;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  color:#bbb;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #3a3e45;
  background:#090a0c;
  color:#fff;
  font-size:16px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  margin-top:14px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn{
  background:#f0c75e;
  color:#111;
}

.btn2{
  background:#252930;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.item{
  border:1px solid #30343b;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
  background:#0d0f12;
}

.price{
  color:#f0c75e;
  font-size:20px;
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#252930;
  margin-top:8px;
}

.success{
  color:#7ee787;
}

.error{
  color:#ff7b72;
}

.small{
  color:#888;
  font-size:14px;
}

.hidden{
  display:none;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:12px;
  }

  header{
    padding:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">TERRA BŪVE</div>
</header>

<div class="wrap">

<div class="card">
  <h1>Objektu sistēma</h1>
  <p class="small">
    Objektu, papilddarbu un klientu saskaņošanas sistēma.
  </p>

  <label>Supabase Publishable Key</label>
  <input id="supabaseKey"
         type="password"
         placeholder="Ievieto savu Publishable Key">

  <button class="btn" onclick="connectSupabase()">
    Pieslēgt Supabase
  </button>

  <div id="connectionStatus" class="small"></div>
</div>


<div id="system" class="hidden">

<div class="card">
  <h2>Jauns objekts</h2>

  <label>Objekta nosaukums</label>
  <input id="objName" placeholder="Piemēram: Privātmāja Ādažos">

  <label>Klients</label>
  <input id="clientName" placeholder="Klienta vārds, uzvārds">

  <label>Telefons</label>
  <input id="clientPhone" placeholder="+371 ...">

  <label>Adrese</label>
  <input id="objAddress" placeholder="Objekta adrese">

  <label>Piezīmes</label>
  <textarea id="objNotes"
            placeholder="Papildu informācija"></textarea>

  <button class="btn" onclick="createObject()">
    Izveidot objektu
  </button>
</div>


<div class="card">
  <h2>Izvēlētais objekts</h2>

  <select id="objectSelect" onchange="loadObject()">
    <option value="">-- Izvēlies objektu --</option>
  </select>

  <div id="objectInfo"></div>
</div>


<div class="card">
  <h2>Papilddarbs</h2>

  <label>Darba nosaukums</label>
  <input id="workName"
         placeholder="Piemēram: Papildu grunts izvešana">

  <label>Apraksts</label>
  <textarea id="workDescription"
            placeholder="Apraksti, kas jāizdara"></textarea>

  <div class="grid">

    <div>
      <label>Daudzums</label>
      <input id="workQty"
             type="number"
             value="1"
             step="0.01">
    </div>

    <div>
      <label>Mērvienība</label>
      <select id="workUnit">
        <option>gab.</option>
        <option>m²</option>
        <option>m³</option>
        <option>m</option>
        <option>h</option>
      </select>
    </div>

  </div>

  <label>Cena par vienību (€)</label>
  <input id="workPrice"
         type="number"
         value="0"
         step="0.01">

  <div class="grid">

    <div>
      <label>Materiāli (€)</label>
      <input id="workMaterials"
             type="number"
             value="0"
             step="0.01">
    </div>

    <div>
      <label>Darbs (€)</label>
      <input id="workLabor"
             type="number"
             value="0"
             step="0.01">
    </div>

  </div>

  <button class="btn" onclick="createWork()">
    Pievienot papilddarbu
  </button>

  <div id="workMessage"></div>
</div>


<div class="card">
  <h2>Papilddarbi</h2>

  <div id="worksList">
    <p class="small">Izvēlies objektu.</p>
  </div>
</div>


</div>

</div>


<script>

const SUPABASE_URL =
"https://nmxdvvagdanajplzgyju.supabase.co";

let supabaseClient = null;
let objects = [];


function connectSupabase(){

  const key =
    document.getElementById("supabaseKey").value.trim();

  if(!key){
    showConnection(
      "Ievieto Supabase Publishable Key.",
      true
    );
    return;
  }

  try{

    supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        key
      );

    localStorage.setItem(
      "terra_supabase_key",
      key
    );

    showConnection(
      "Supabase savienojums izveidots.",
      false
    );

    document
      .getElementById("system")
      .classList.remove("hidden");

    loadObjects();

  }catch(error){

    showConnection(
      "Kļūda: " + error.message,
      true
    );

  }
}


function showConnection(text,error){

  const el =
    document.getElementById("connectionStatus");

  el.textContent = text;

  el.className =
    error ? "small error" : "small success";
}


async function loadObjects(){

  if(!supabaseClient) return;

  const {data,error} =
    await supabaseClient
      .from("objekti")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    alert(
      "Neizdevās ielādēt objektus:\n"
      + error.message
    );

    return;
  }

  objects = data || [];

  const select =
    document.getElementById("objectSelect");

  select.innerHTML =
    '<option value="">-- Izvēlies objektu --</option>';

  objects.forEach(obj=>{

    const option =
      document.createElement("option");

    option.value = obj.id;

    option.textContent =
      obj.nosaukums;

    select.appendChild(option);

  });

}


async function createObject(){

  const name =
    document.getElementById("objName")
      .value.trim();

  if(!name){

    alert("Ievadi objekta nosaukumu.");

    return;
  }

  const client =
    document.getElementById("clientName")
      .value.trim();

  const phone =
    document.getElementById("clientPhone")
      .value.trim();

  const address =
    document.getElementById("objAddress")
      .value.trim();

  const notes =
    document.getElementById("objNotes")
      .value.trim();


  const {data,error} =
    await supabaseClient
      .from("objekti")
      .insert([{
        nosaukums:name,
        klients:client,
        telefons:phone,
        adrese:address,
        piezimes:notes,
        statuss:"Aktīvs"
      }])
      .select()
      .single();


  if(error){

    alert(
      "Kļūda izveidojot objektu:\n"
      + error.message
    );

    return;
  }


  alert("Objekts izveidots!");

  document.getElementById("objName").value="";
  document.getElementById("clientName").value="";
  document.getElementById("clientPhone").value="";
  document.getElementById("objAddress").value="";
  document.getElementById("objNotes").value="";

  await loadObjects();

  document.getElementById("objectSelect").value =
    data.id;

  loadObject();

}


async function loadObject(){

  const id =
    document.getElementById("objectSelect").value;

  const info =
    document.getElementById("objectInfo");

  if(!id){

    info.innerHTML="";

    document.getElementById("worksList").innerHTML =
      '<p class="small">Izvēlies objektu.</p>';

    return;
  }


  const obj =
    objects.find(x=>x.id===id);

  if(obj){

    info.innerHTML = `
      <div class="item">
        <h3>${escapeHtml(obj.nosaukums)}</h3>
        <div>Klients: ${escapeHtml(obj.klients || "-")}</div>
        <div>Telefons: ${escapeHtml(obj.telefons || "-")}</div>
        <div>Adrese: ${escapeHtml(obj.adrese || "-")}</div>
        <div class="small">
          ${escapeHtml(obj.piezimes || "")}
        </div>
      </div>
    `;
  }


  await loadWorks(id);

}


async function loadWorks(objectId){

  const list =
    document.getElementById("worksList");

  list.innerHTML =
    '<p class="small">Ielādē...</p>';


  const {data,error} =
    await supabaseClient
      .from("papilddarbi")
      .select("*")
      .eq("objekts_id",objectId)
      .order("created_at",{ascending:false});


  if(error){

    list.innerHTML =
      '<p class="error">'
      + escapeHtml(error.message)
      + '</p>';

    return;
  }


  if(!data || !data.length){

    list.innerHTML =
      '<p class="small">Papilddarbu vēl nav.</p>';

    return;
  }


  list.innerHTML="";


  data.forEach(work=>{

    const total =
      Number(work.daudzums || 0) *
      Number(work.cena || 0);


    const div =
      document.createElement("div");

    div.className="item";

    div.innerHTML=`

      <h3>${escapeHtml(work.nosaukums)}</h3>

      <div>
        ${escapeHtml(work.apraksts || "")}
      </div>

      <p>
        Daudzums:
        <b>${work.daudzums}</b>
        ${escapeHtml(work.vienibas || "")}
      </p>

      <div class="price">
        ${total.toFixed(2)} €
      </div>

      <div>
        Materiāli:
        ${Number(work.materials || 0).toFixed(2)} €
      </div>

      <div>
        Darbs:
        ${Number(work.darbs || 0).toFixed(2)} €
      </div>

      <div class="status">
        ${escapeHtml(work.statuss || "")}
      </div>

    `;

    list.appendChild(div);

  });

}


async function createWork(){

  const objectId =
    document.getElementById("objectSelect").value;

  if(!objectId){

    alert("Vispirms izvēlies objektu.");

    return;
  }


  const name =
    document.getElementById("workName")
      .value.trim();

  if(!name){

    alert("Ievadi papilddarba nosaukumu.");

    return;
  }


  const description =
    document.getElementById("workDescription")
      .value.trim();

  const qty =
    Number(
      document.getElementById("workQty").value
    ) || 0;

  const unit =
    document.getElementById("workUnit").value;

  const price =
    Number(
      document.getElementById("workPrice").value
    ) || 0;

  const materials =
    Number(
      document.getElementById("workMaterials").value
    ) || 0;

  const labor =
    Number(
      document.getElementById("workLabor").value
    ) || 0;


  const {error} =
    await supabaseClient
      .from("papilddarbi")
      .insert([{

        objekts_id:objectId,

        nosaukums:name,

        apraksts:description,

        daudzums:qty,

        vienibas:unit,

        cena:price,

        materials:materials,

        darbs:labor,

        statuss:"Gaida saskaņošanu"

      }]);


  if(error){

    document.getElementById("workMessage")
      .innerHTML =
      '<p class="error">'
      + escapeHtml(error.message)
      + '</p>';

    return;
  }


  document.getElementById("workMessage")
    .innerHTML =
    '<p class="success">Papilddarbs pievienots!</p>';


  document.getElementById("workName").value="";
  document.getElementById("workDescription").value="";
  document.getElementById("workQty").value="1";
  document.getElementById("workPrice").value="0";
  document.getElementById("workMaterials").value="0";
  document.getElementById("workLabor").value="0";


  await loadWorks(objectId);

}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


window.addEventListener("load",()=>{

  const saved =
    localStorage.getItem(
      "terra_supabase_key"
    );

  if(saved){

    document.getElementById("supabaseKey")
      .value=saved;

  }

});

</script>

</body>
</html>
